name: Docker Image

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "docker-compose.yml"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 镜像 tag 跟随 app/build.gradle.kts 的 versionName，与 APK 版本保持一致
      - name: Read version
        id: version
        run: |
          v=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          if [ -z "$v" ]; then echo "versionName not found" >&2; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tvautoplayer-server
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha

      # amd64 给 x86 服务器，arm64 给树莓派/ARM NAS；同一份 Dockerfile 多架构构建
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 默认会额外推送 provenance/SBOM 证明清单，platform 为 unknown/unknown。
          # 部分客户端与代理镜像会卡在这两个条目上报 no matching manifest，关掉后
          # 索引里只剩 amd64 与 arm64，兼容性最好。
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
