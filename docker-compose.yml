services:
  server:
    build:
      context: ./server
    image: tvautoplayer-server:latest
    container_name: tvautoplayer-server
    restart: unless-stopped
    ports:
      # 电视端与管理后台都通过这个端口访问，务必保持局域网可达
      - "8300:8300"
    environment:
      TZ: Asia/Shanghai
      PORT: "8300"
      # 数据库与密钥
      TV_DATA_DIR: /data
      # 上传的媒体与主媒体库，单独一个卷，宿主机可直接读写
      TV_MEDIA_DIR: /media
      # 网页上传单文件上限（GB）
      MAX_UPLOAD_GB: "8"
    volumes:
      # 数据库 + 密钥：只有几 MB，备份时整个目录拷走即可
      - ./data:/data
      # 媒体文件：可以直接往宿主机 ./media 里拷视频，后台点扫描即可入库
      - ./media:/media
